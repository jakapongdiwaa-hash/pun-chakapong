<!DOCTYPE html>
<html>
<head>
  <title>แจ้งของหาย</title>
</head>
<body>
  <h1>ระบบแจ้งของหาย-เจอของ</h1>
  <p>โรงเรียนสรรพวิทยาคม</p>

  <h2>แจ้งของหาย/เจอของ</h2>
  <form>
    <label>ชื่อ-นามสกุล: <input type="text"></label><br>
    <label>ชื่อสิ่งของที่พบ/หาย: <input type=“text”></label><br>
    <label>สถานะ:
      <select>
        <option>ของหาย</option>
        <option>เจอของ</option>
      </select>
    </label><br>
    <label>สถานที่: <input type=“text”></label><br>
    <label>เมื่อเวลา(เช่น15:00): <input type=“text”></label><br>
    <label>ช่องทางติดต่อ: <input type=“text”></label><br>
    <button type=“submit”>แจ้งข้อมูล</button>
  </form>

  <h2>รายการที่แจ้งไว้</h2>
  <ul id=“itemList”>
  </ul>
</body>
</html>
